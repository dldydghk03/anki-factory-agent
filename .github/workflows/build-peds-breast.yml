name: Build pediatric surgery and breast imaging APKG

on:
  push:
    branches:
      - build/peds-breast-20260826
    paths:
      - 'deck_build/**'
      - '.github/workflows/build-peds-breast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install genanki pymupdf pillow gdown zstandard

      - name: Build and validate final decks
        run: python deck_build/run_final_v3.py

      - name: List outputs
        run: |
          find deck_build/output -maxdepth 1 -type f -printf '%f %s bytes\n'
          echo '--- FINAL VALIDATION ---'
          cat deck_build/output/FINAL_VALIDATION.md

      - name: Prepare direct APKG artifact payloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          out = Path('deck_build/output')
          payload = Path('deck_build/apkg_payload')
          shutil.rmtree(payload, ignore_errors=True)
          (payload / 'pediatric').mkdir(parents=True)
          (payload / 'breast').mkdir(parents=True)

          files = list(out.glob('*누락검수완료.apkg'))
          pediatric = next(p for p in files if '소아외과' in p.name)
          breast = next(p for p in files if '유방영상학' in p.name)

          for apkg, target in [(pediatric, payload / 'pediatric'), (breast, payload / 'breast')]:
              with zipfile.ZipFile(apkg) as zf:
                  zf.extractall(target)
              names = {p.name for p in target.iterdir()}
              if not ({'collection.anki2', 'collection.anki21', 'collection.anki21b'} & names):
                  raise RuntimeError(f'No Anki collection database in {apkg.name}')
              if 'media' not in names:
                  raise RuntimeError(f'No media map in {apkg.name}')
              print(apkg.name, '=>', target, len(names), 'root entries')
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: final-verified-anki-decks
          path: |
            deck_build/output/*누락검수완료.apkg
            deck_build/output/BUILD_REPORT.md
            deck_build/output/FINAL_VALIDATION.md
          if-no-files-found: error
          compression-level: 0

      - name: Upload Pediatric Surgery as direct APKG
        uses: actions/upload-artifact@v4
        with:
          name: pediatric-surgery-verified-direct-apkg
          path: deck_build/apkg_payload/pediatric/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload Breast Imaging as direct APKG
        uses: actions/upload-artifact@v4
        with:
          name: breast-imaging-verified-direct-apkg
          path: deck_build/apkg_payload/breast/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload image previews
        uses: actions/upload-artifact@v4
        with:
          name: final-deck-image-crops
          path: deck_build/work/media/*.png
          if-no-files-found: error
          compression-level: 6

      - name: Publish verified APKG files for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="anki-decks-verified-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            deck_build/output/*누락검수완료.apkg \
            deck_build/output/BUILD_REPORT.md \
            deck_build/output/FINAL_VALIDATION.md \
            --target "$GITHUB_SHA" \
            --title "Verified Pediatric Surgery and Breast Imaging Anki decks" \
            --notes "Required subdecks, populated exam fields, standardized note types, embedded media, and absence of tags were validated before release."
