name: Validate and build final APKG files

on:
  pull_request:
  push:
    branches:
      - main
      - chatgpt/final-apkg-rebuild-20260816

permissions:
  contents: write

jobs:
  review-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate review events
        run: npm run validate

  build-apkg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download valid source and reference files
        run: |
          python -m pip install --quiet gdown
          mkdir -p work_inputs
          gdown 1ponxLuAN44DagrRoVwMNKIVxsjOJ0pKJ -O work_inputs/gyne_source.apkg
          gdown 1Kz_cvHYU3LPDx5VvwGRk0bnzuWHwsGmO -O work_inputs/infertility_source.apkg
          gdown 1Xa8q6_XXXtzdGbDSOwmyh31dKzFOv0Hh -O work_inputs/reference_lee_wonjae.apkg
          cp work_inputs/reference_lee_wonjae.apkg work_inputs/reference_lee_sanghoon.apkg
          gdown 1CATab4Ua2GeH6xSUznXE-OCAEfP1EE92 -O work_inputs/concept_style_reference.md
          python - <<'PY'
          import zipfile
          for name in ['gyne_source.apkg','infertility_source.apkg','reference_lee_wonjae.apkg','reference_lee_sanghoon.apkg']:
              assert zipfile.is_zipfile('work_inputs/'+name), name
          PY

      - name: Build and validate both decks
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/final_rebuild_v2.py')
          text = path.read_text(encoding='utf-8')
          old = "if not cards or not any(card[2] in existing_jbl_dids for card in cards):"
          new = "if not cards or not any(card[2] == optional_did for card in cards):"
          assert old in text
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python run_final_build.py
          python - <<'PY'
          from pathlib import Path
          report = Path('outputs_v2/두_덱_개념선행_최종검증.txt').read_text(encoding='utf-8')
          for section in report.split('\n\n'):
              if 'active_application_cards:' in section:
                  value = int(section.split('active_application_cards:')[1].splitlines()[0].strip())
                  assert value > 0, section
          PY

      - name: Upload completed decks as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-apkg-decks
          path: |
            outputs_v2/*.apkg
            outputs_v2/*.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish final APKG release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=chatgpt-final-apkg-20260816
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Final concept-first APKG decks" --notes "Concept-first cloze learning, later image/application cards, revised past-exam explanations, preserved note types, and validated media/database integrity."
          gh release upload "$TAG" outputs_v2/*.apkg outputs_v2/*.txt --clobber
