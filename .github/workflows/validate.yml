name: Validate and build final APKG files

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  review-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate review events
        run: npm run validate

  build-apkg:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download valid source and reference files
        run: |
          python -m pip install --quiet gdown
          mkdir -p work_inputs
          gdown 1ponxLuAN44DagrRoVwMNKIVxsjOJ0pKJ -O work_inputs/gyne_source.apkg
          gdown 1Kz_cvHYU3LPDx5VvwGRk0bnzuWHwsGmO -O work_inputs/infertility_source.apkg
          gdown 1Xa8q6_XXXtzdGbDSOwmyh31dKzFOv0Hh -O work_inputs/reference_lee_wonjae.apkg
          cp work_inputs/reference_lee_wonjae.apkg work_inputs/reference_lee_sanghoon.apkg
          gdown 1CATab4Ua2GeH6xSUznXE-OCAEfP1EE92 -O work_inputs/concept_style_reference.md
          python - <<'PY'
          import zipfile
          for name in ['gyne_source.apkg','infertility_source.apkg','reference_lee_wonjae.apkg','reference_lee_sanghoon.apkg']:
              path='work_inputs/'+name
              assert zipfile.is_zipfile(path), path
          PY

      - name: Inspect infertility package schema
        run: |
          python - <<'PY'
          import zipfile, tempfile, pathlib, sqlite3, os
          src='work_inputs/infertility_source.apkg'
          with tempfile.TemporaryDirectory() as td:
              with zipfile.ZipFile(src) as z:
                  print('members', z.namelist()[:30])
                  z.extractall(td)
              for p in pathlib.Path(td).glob('collection.anki*'):
                  print('candidate', p.name, p.stat().st_size)
                  try:
                      con=sqlite3.connect(p)
                      print('tables', con.execute("select name from sqlite_master where type='table'").fetchall())
                      con.close()
                  except Exception as e:
                      print('error', e)
          PY

      - name: Build and validate both decks
        run: python tools/final_rebuild.py

      - name: Upload completed decks
        uses: actions/upload-artifact@v4
        with:
          name: final-apkg-decks
          path: |
            outputs/*.apkg
            outputs/*.txt
          if-no-files-found: error
          retention-days: 7
