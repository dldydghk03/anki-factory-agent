name: Build final verified pediatric surgery and breast imaging APKG

on:
  push:
    branches:
      - build/final-v3-20260826
    paths:
      - 'deck_build/final_v3/**'
      - 'deck_build/build_decks.py'
      - '.github/workflows/build-final-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install genanki pymupdf pillow gdown zstandard requests

      - name: Preload all source files
        run: |
          set -euo pipefail
          mkdir -p deck_build/work/sources
          curl -L --fail --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-14f4-8206-a440-aa157b85ba5c/raw?se=2026-08-26T01%3A01%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=356c8129-f4b6-5656-9ad9-e8eea61fab1f&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-25T23%3A12%3A02Z&ske=2026-08-26T23%3A12%3A02Z&sks=b&skv=2026-02-06&sig=SbDvuwPHgIInVFkBgnvS17ZVJilaFoOcOZtwl3/W/AQ%3D' -o deck_build/work/sources/peds_lecture.pdf &
          curl -L --fail --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-165c-8206-a73b-2ef47387e4d5/raw?se=2026-08-26T01%3A02%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=165e55fa-4608-5538-80cf-4c8154097b8a&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-26T00%3A42%3A00Z&ske=2026-08-27T00%3A42%3A00Z&sks=b&skv=2026-02-06&sig=TBw7/DBfG2xnRJb8UVVR/IKjEt2ePWX9AADAUY7TNho%3D' -o deck_build/work/sources/peds_summary.pdf &
          curl -L --fail --retry 3 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-0530-8209-9456-42da1f64739c/raw?se=2026-08-26T01%3A02%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=0f1785b0-9d12-52fc-9535-d86afd5473a2&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-26T00%3A41%3A59Z&ske=2026-08-27T00%3A41%3A59Z&sks=b&skv=2026-02-06&sig=Cg/iS%2B7kZ%2Bg6eVEJysxIc0NXRP4yY3kIY5X7tk2wvvM%3D' -o deck_build/work/sources/breast_lecture.pdf &
          curl -L --fail --retry 3 'https://sdmntprseasia.oaiusercontent.com/files/00000000-f5ac-8207-a1d1-25007c4d4810/raw?se=2026-08-26T01%3A03%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=afa8d524-adc1-55d7-9a91-c528d374e03f&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-26T00%3A41%3A56Z&ske=2026-08-27T00%3A41%3A56Z&sks=b&skv=2026-02-06&sig=zT6%2B7E/NMMI/3Fi8RklTP%2B34ccwgQNBGiBECXvviXOg%3D' -o deck_build/work/sources/linked_exam.pdf &
          curl -L --fail --retry 3 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-b6a4-8209-a41f-bc89febc15a5/raw?se=2026-08-26T01%3A04%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=b2103877-5c86-57e4-9696-61c7e38e13db&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-26T00%3A17%3A58Z&ske=2026-08-26T22%3A59%3A33Z&sks=b&skv=2026-02-06&sig=wqROeJkHK45gv%2BS%2B/qYfAfXpzvg4COGwDd7UE4M99Fs%3D' -o deck_build/work/sources/template_acute.apkg &
          wait
          cp deck_build/work/sources/template_acute.apkg deck_build/work/sources/template_complication.apkg
          cp deck_build/work/sources/template_acute.apkg deck_build/work/sources/template_vascular.apkg
          python - <<'PY'
          from pathlib import Path
          expected = {
              'peds_lecture.pdf': (b'%PDF', 7110749),
              'peds_summary.pdf': (b'%PDF', 19551504),
              'breast_lecture.pdf': (b'%PDF', 4986109),
              'linked_exam.pdf': (b'%PDF', 20733103),
              'template_acute.apkg': (b'PK', 3463365),
              'template_complication.apkg': (b'PK', 3463365),
              'template_vascular.apkg': (b'PK', 3463365),
          }
          root = Path('deck_build/work/sources')
          for name, (magic, size) in expected.items():
              data = (root / name).read_bytes()
              assert data.startswith(magic), f'{name}: wrong magic bytes'
              assert len(data) == size, f'{name}: {len(data)} != {size}'
              print(f'{name}: {len(data):,} bytes OK')
          PY

      - name: Preserve source cache
        uses: actions/upload-artifact@v4
        with:
          name: final-build-source-cache-v3
          path: deck_build/work/sources/*
          if-no-files-found: error
          compression-level: 0

      - name: Build and validate APKG files
        run: python deck_build/final_v3/run_final_v3_fixed.py

      - name: List verified outputs
        run: |
          find deck_build/output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo '--- FINAL_VALIDATION.txt ---'
          cat deck_build/output/FINAL_VALIDATION.txt

      - name: Upload final verified package
        uses: actions/upload-artifact@v4
        with:
          name: final-verified-anki-decks-v3
          path: |
            deck_build/output/소아외과_유방영상학_APKG_최종검수.zip
            deck_build/output/*_최종검수.apkg
            deck_build/output/FINAL_VALIDATION.txt
          if-no-files-found: error
          compression-level: 0
