name: Build final verified pediatric surgery and breast imaging APKG

on:
  push:
    branches:
      - build/final-v3-20260826
    paths:
      - 'deck_build/final_v3/**'
      - 'deck_build/build_decks.py'
      - '.github/workflows/build-final-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install genanki pymupdf pillow gdown zstandard requests

      - name: Preload all source files
        run: |
          set -euo pipefail
          mkdir -p deck_build/work/sources
          curl -L --fail --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-4a38-8206-800e-28b99a1a4b09/raw?se=2026-08-26T00%3A58%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=71811240-7fd7-5fe1-87da-d657f1d16e08&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-25T23%3A11%3A56Z&ske=2026-08-26T23%3A11%3A56Z&sks=b&skv=2026-02-06&sig=aA9/GOUyOilgnzoSEWtOM5L2RkK%2Bqvcb4UVmj7DABqw%3D' -o deck_build/work/sources/peds_lecture.pdf &
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-5644-81f5-9189-0daf335114c0/raw?se=2026-08-26T00%3A56%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=18cf7f6e-abf7-5db0-ab1e-200c4165c39f&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-26T00%3A41%3A57Z&ske=2026-08-27T00%3A41%3A57Z&sks=b&skv=2026-02-06&sig=t41OYKCLXaITTWb/IwD/vlVbYsZ0QjrHyhzehR/9i7g%3D' -o deck_build/work/sources/peds_summary.pdf &
          curl -L --fail --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-cf1c-8206-a99b-72dfed88d505/raw?se=2026-08-26T00%3A56%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=61f9f93a-f7ca-5278-a03e-cea0afe85e58&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-25T23%3A01%3A08Z&ske=2026-08-26T23%3A01%3A08Z&sks=b&skv=2026-02-06&sig=6%2BwDlt%2B5Mm1QWCYd23mXTVQ6g2LOWjTkscH/UU17z6I%3D' -o deck_build/work/sources/breast_lecture.pdf &
          curl -L --fail --retry 3 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-aaac-8209-bd2d-73ff0bd7f397/raw?se=2026-08-26T00%3A57%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=086213b2-f0b9-5693-b794-fe1d19e783b9&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-26T00%3A17%3A59Z&ske=2026-08-27T00%3A17%3A59Z&sks=b&skv=2026-02-06&sig=fIPTGTRwoe0N96IIAeFw8c1A4Mv8tNjBxrY8uQpqM60%3D' -o deck_build/work/sources/linked_exam.pdf &
          curl -L --fail --retry 3 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-d3e4-8209-9d64-bc43f1c99666/raw?se=2026-08-26T00%3A57%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=55635638-dbb3-528d-b898-3ca1d86ebbe6&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-25T22%3A59%3A33Z&ske=2026-08-26T22%3A59%3A33Z&sks=b&skv=2026-02-06&sig=L3sH4XHwX17xoKGt6mqArR6twON49Y3ZKW25yRfehaM%3D' -o deck_build/work/sources/template_acute.apkg &
          wait
          cp deck_build/work/sources/template_acute.apkg deck_build/work/sources/template_complication.apkg
          cp deck_build/work/sources/template_acute.apkg deck_build/work/sources/template_vascular.apkg
          python - <<'PY'
          from pathlib import Path
          expected = {
              'peds_lecture.pdf': (b'%PDF', 7110749),
              'peds_summary.pdf': (b'%PDF', 19551504),
              'breast_lecture.pdf': (b'%PDF', 4986109),
              'linked_exam.pdf': (b'%PDF', 20733103),
              'template_acute.apkg': (b'PK', 3463365),
              'template_complication.apkg': (b'PK', 3463365),
              'template_vascular.apkg': (b'PK', 3463365),
          }
          root = Path('deck_build/work/sources')
          for name, (magic, size) in expected.items():
              data = (root / name).read_bytes()
              assert data.startswith(magic), f'{name}: wrong magic bytes'
              assert len(data) == size, f'{name}: {len(data)} != {size}'
              print(f'{name}: {len(data):,} bytes OK')
          PY

      - name: Build and validate APKG files
        run: python deck_build/final_v3/run_final_v3_fixed.py

      - name: List verified outputs
        run: |
          find deck_build/output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo '--- FINAL_VALIDATION.txt ---'
          cat deck_build/output/FINAL_VALIDATION.txt

      - name: Upload final verified package
        uses: actions/upload-artifact@v4
        with:
          name: final-verified-anki-decks-v3
          path: |
            deck_build/output/소아외과_유방영상학_APKG_최종검수.zip
            deck_build/output/*_최종검수.apkg
            deck_build/output/FINAL_VALIDATION.txt
          if-no-files-found: error
          compression-level: 0
